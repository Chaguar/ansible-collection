- name: Teardown Chaguar Loadgen container
  ansible.builtin.include_role:
    name: lfdt.chaguar.loadgen
    tasks_from: container/rm
  when: loadgen_use_container

- name: Stop Chaguar Loadgen binary
  ansible.builtin.include_role:
    name: lfdt.chaguar.loadgen
    tasks_from: bin/stop
  when: loadgen_use_bin

- name: Remove Chaguar Loadgen Kubernetes resources
  ansible.builtin.include_role:
    name: lfdt.chaguar.loadgen
    tasks_from: k8s/rm
  when: loadgen_use_k8s

- name: Teardown Loadgen on OpenShift
  ansible.builtin.include_role:
    name: lfdt.chaguar.loadgen
    tasks_from: openshift/rm
  when: loadgen_use_openshift
