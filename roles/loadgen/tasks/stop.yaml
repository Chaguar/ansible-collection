- name: Stop Chaguar Loadgen container
  ansible.builtin.include_role:
    name: hyperledger.chaguar.loadgen
    tasks_from: container/stop
  when: loadgen_use_container

- name: Stop Chaguar Loadgen binary
  ansible.builtin.include_role:
    name: hyperledger.chaguar.loadgen
    tasks_from: bin/stop
  when: loadgen_use_bin
