# =========================
# Namespace
# =========================
- name: Ensure Kubernetes namespace exists for Chaguar Committer verifier
  ansible.builtin.include_role:
    name: lfdt.chaguar.k8s
    tasks_from: namespace/create

# =========================
# Apply ConfigMap
# =========================
- name: Apply Chaguar Committer verifier ConfigMap
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/configmap-verifier.yaml.j2
