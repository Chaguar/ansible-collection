# =========================
# Namespace
# =========================
- name: Ensure Kubernetes namespace exists for Chaguar Committer
  ansible.builtin.include_role:
    name: lfdt.chaguar.k8s
    tasks_from: namespace/create

# =========================
# Apply Resources
# =========================
- name: Apply Chaguar Committer Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service.yaml.j2

- name: Apply Chaguar Committer NodePort Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service-nodeport.yaml.j2
  when:
    - committer_k8s_rpc_node_port is defined or
      committer_k8s_metrics_node_port is defined

- name: Apply Chaguar Committer LoadBalancer Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service-loadbalancer.yaml.j2
  when:
    - committer_k8s_loadbalancer_expose_rpc_port or
      committer_k8s_loadbalancer_expose_metrics_port

- name: Apply Chaguar Committer Deployment
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: "k8s/deployment-{{ committer_component_type }}.yaml.j2"
    wait: true
    wait_timeout: "{{ committer_k8s_wait_timeout }}"
  when:
    - committer_component_type not in ['sidecar', 'coordinator']

- name: Apply Chaguar Committer StatefulSet
  vars:
    committer_validator_ref_host: "{{ committer_validators | first }}"
    committer_verifier_ref_host: "{{ committer_verifiers | first }}"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: "k8s/statefulset-{{ committer_component_type }}.yaml.j2"
    wait: true
    wait_timeout: "{{ committer_k8s_wait_timeout }}"
  when:
    - committer_component_type in ['sidecar', 'coordinator']
