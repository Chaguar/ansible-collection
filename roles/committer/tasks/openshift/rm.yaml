- name: Delete LFDT Chaguar Committer rpc OpenShift Route
  vars:
    openshift_route_name: "{{ committer_k8s_resource_name }}-rpc"
  ansible.builtin.include_role:
    name: lfdt.chaguar.openshift
    tasks_from: route/rm
  when: committer_openshift_route is defined

- name: Delete LFDT Chaguar Committer metrics OpenShift Route
  vars:
    openshift_route_name: "{{ committer_k8s_resource_name }}-metrics"
  ansible.builtin.include_role:
    name: lfdt.chaguar.openshift
    tasks_from: route/rm
  when: committer_openshift_metrics_route is defined

- name: Remove LFDT Chaguar Committer workload using generic k8s flow
  ansible.builtin.include_role:
    name: lfdt.chaguar.committer
    tasks_from: k8s/rm
