- name: Remove LFDT Chaguar Committer TLS directory
  ansible.builtin.file:
    path: "{{ committer_remote_config_dir }}/tls"
    state: absent
  when:
    - committer_use_tls

- name: Remove LFDT Chaguar Committer users directory
  ansible.builtin.file:
    path: "{{ committer_remote_config_dir }}/users"
    state: absent
  when:
    - organization.user is defined

- name: Remove Chaguar Committer k8s Secret
  ansible.builtin.include_role:
    name: hyperledger.chaguar.committer
    tasks_from: k8s/crypto/rm
  when: committer_use_k8s or committer_use_openshift
