# =========================
# Namespace
# =========================
- name: Ensure Kubernetes namespace exists for Chaguar Orderer
  ansible.builtin.include_role:
    name: lfdt.chaguar.k8s
    tasks_from: namespace/create

# =========================
# Genesis block
# =========================
- name: Slurp Chaguar Orderer genesis block
  ansible.builtin.slurp:
    src: "{{ orderer_remote_config_dir }}/genesis.block"
  register: orderer_slurp_genesis

# =========================
# Apply ConfigMap
# =========================
- name: Apply Chaguar Orderer ConfigMap
  vars:
    orderer_k8s_genesis_block_b64: "{{ orderer_slurp_genesis.content }}"
    # Deduplicated names of the mTLS clients and organization domains whose CA
    # certificates are mounted under mtls/<name>/ca.crt.
    orderer_k8s_mtls_ca_names: >-
      {{
        (
          (
            (orderer_mtls_clients | default([]))
            + (orderer_mtls_orgs | default([]) | map(attribute='domain') | list)
            if orderer_use_mtls else []
          )
          + (
            (orderer_operations_mtls_clients | default([]))
            + (orderer_operations_mtls_orgs | default([]) | map(attribute='domain') | list)
            if orderer_operations_use_mtls else []
          )
        ) | unique
      }}
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/configmap.yaml.j2
