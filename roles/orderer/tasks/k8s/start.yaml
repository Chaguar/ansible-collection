# =========================
# Namespace
# =========================
- name: Ensure Kubernetes namespace exists for Chaguar Orderer
  ansible.builtin.include_role:
    name: lfdt.chaguar.k8s
    tasks_from: namespace/create

# =========================
# Apply Resources
# =========================
- name: Apply Chaguar Orderer Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service.yaml.j2

- name: Apply Chaguar Orderer NodePort Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service-nodeport.yaml.j2
  when:
    - orderer_k8s_rpc_node_port is defined or
      orderer_k8s_metrics_node_port is defined

- name: Apply Chaguar Orderer LoadBalancer Service
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/service-loadbalancer.yaml.j2
  when:
    - orderer_k8s_loadbalancer_expose_rpc_port or
      orderer_k8s_loadbalancer_expose_metrics_port

- name: Apply Chaguar Orderer StatefulSet
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/statefulset.yaml.j2
    wait: true
    wait_timeout: "{{ orderer_k8s_wait_timeout }}"
