- name: Check that the Chaguar Orderer gRPC node port is open
  vars:
    utils_ports_to_ping:
      - "{{ orderer_k8s_rpc_node_port }}"
  ansible.builtin.include_role:
    name: lfdt.chaguar.utils
    tasks_from: ping
  when:
    - orderer_k8s_rpc_node_port is defined

- name: Check that the Chaguar Orderer gRPC load balancer port is open
  vars:
    utils_ports_to_ping:
      - "{{ orderer_rpc_port }}"
  ansible.builtin.include_role:
    name: lfdt.chaguar.utils
    tasks_from: ping
  when:
    - orderer_k8s_loadbalancer_expose_rpc_port

- name: Check that the Chaguar Orderer operations node port is open
  vars:
    utils_ports_to_ping:
      - "{{ orderer_k8s_metrics_node_port }}"
  ansible.builtin.include_role:
    name: lfdt.chaguar.utils
    tasks_from: ping
  when:
    - orderer_k8s_metrics_node_port is defined

- name: Check that the Chaguar Orderer operations load balancer port is open
  vars:
    utils_ports_to_ping:
      - "{{ orderer_operations_port }}"
  ansible.builtin.include_role:
    name: lfdt.chaguar.utils
    tasks_from: ping
  when:
    - orderer_k8s_loadbalancer_expose_metrics_port
