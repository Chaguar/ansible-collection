- name: Remove Chaguar Orderer Kubernetes workload
  ansible.builtin.include_role:
    name: hyperledger.chaguar.orderer
    tasks_from: k8s/rm

- name: Remove Chaguar Orderer data
  ansible.builtin.include_role:
    name: hyperledger.chaguar.orderer
    tasks_from: data/rm
