- name: Remove Chaguar Orderer config directory
  ansible.builtin.file:
    path: "{{ orderer_remote_config_dir }}"
    state: absent

- name: Remove Chaguar Orderer K8s config
  ansible.builtin.include_role:
    name: hyperledger.chaguar.orderer
    tasks_from: k8s/config/rm
  when: orderer_use_k8s or orderer_use_openshift
