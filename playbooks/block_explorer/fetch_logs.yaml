- name: Fetch the Chaguar Block Explorer logs
  hosts: "{{ target_hosts | default('chaguar_block_explorer') }}:&chaguar_block_explorer"
  tasks:
    - name: Fetch the Chaguar Block Explorer server and UI logs
      ansible.builtin.include_role:
        name: lfdt.chaguar.block_explorer
        tasks_from: fetch_logs
      when:
        - block_explorer_port is defined
