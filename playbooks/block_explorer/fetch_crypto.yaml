- name: Fetch the Chaguar Block Explorer crypto material
  hosts: "{{ target_hosts | default('chaguar_block_explorer') }}:&chaguar_block_explorer"
  tasks:
    - name: Fetch the Chaguar Block Explorer server certificates
      ansible.builtin.include_role:
        name: hyperledger.chaguar.block_explorer
        tasks_from: crypto/fetch
      when:
        - block_explorer_port is defined
