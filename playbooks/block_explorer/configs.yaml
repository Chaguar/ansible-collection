- name: Transfer the Chaguar Block Explorer config files
  hosts: "{{ target_hosts | default('chaguar_block_explorer') }}:&chaguar_block_explorer"
  tasks:
    - name: Transfer the Chaguar Block Explorer server config files
      ansible.builtin.include_role:
        name: hyperledger.chaguar.block_explorer
        tasks_from: config/transfer
      when:
        - block_explorer_port is defined
