- name: Stop the Chaguar Block Explorer
  hosts: "{{ target_hosts | default('chaguar_block_explorer') }}:&chaguar_block_explorer"
  tasks:
    # =========================
    # Block Explorer server and UI
    # =========================
    - name: Stop the Chaguar Block Explorer server and UI
      ansible.builtin.include_role:
        name: lfdt.chaguar.block_explorer
        tasks_from: stop
      when:
        - block_explorer_port is defined
