- name: Fetch the Chaguar Committer logs
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    # =========================
    # Yugabyte
    # =========================
    - name: Fetch the Chaguar Committer Yugabyte DB container logs
      ansible.builtin.include_role:
        name: hyperledger.chaguar.yugabyte
        tasks_from: fetch_logs
      when:
        - yugabyte_component_type is defined
    # =========================
    # Chaguar Committer
    # =========================
    - name: Fetch the Chaguar Committer logs
      ansible.builtin.include_role:
        name: hyperledger.chaguar.committer
        tasks_from: fetch_logs
      when:
        - committer_component_type is defined
