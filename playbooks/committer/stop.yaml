- name: Stop the Chaguar Committer
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    # =========================
    # Chaguar Committer
    # =========================
    - name: Stop the Chaguar Committer services
      ansible.builtin.include_role:
        name: lfdt.chaguar.committer
        tasks_from: stop
      when:
        - committer_component_type is defined
