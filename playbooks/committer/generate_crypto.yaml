- name: Generate the Chaguar Committer crypto material
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    # =========================
    # Chaguar Committer
    # =========================
    - name: Setup LFDT Chaguar Committer crypto material
      ansible.builtin.include_role:
        name: lfdt.chaguar.committer
        tasks_from: crypto/setup
      when:
        - committer_component_type is defined
    - name: Fetch LFDT Chaguar Committer certificates
      ansible.builtin.include_role:
        name: lfdt.chaguar.committer
        tasks_from: crypto/fetch
      when:
        - committer_component_type is defined
