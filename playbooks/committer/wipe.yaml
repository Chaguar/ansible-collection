- name: Wipe the Chaguar Committer services
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    # =========================
    # Chaguar Committer
    # =========================
    - name: Wipe the Chaguar Committer services
      ansible.builtin.include_role:
        name: hyperledger.chaguar.committer
        tasks_from: wipe
      when:
        - committer_component_type is defined
