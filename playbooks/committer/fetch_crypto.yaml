- name: Fetch the Chaguar Committer crypto material
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    - name: Fetch LFDT Chaguar Committer Yugabyte DB certificates
      ansible.builtin.include_role:
        name: hyperledger.chaguar.yugabyte
        tasks_from: crypto/fetch
      when:
        - yugabyte_component_type is defined
    - name: Fetch LFDT Chaguar Committer certificates
      ansible.builtin.include_role:
        name: hyperledger.chaguar.committer
        tasks_from: crypto/fetch
      when:
        - committer_component_type is defined
