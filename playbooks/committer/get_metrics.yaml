- name: Collect the Chaguar Committer metrics
  hosts: "{{ target_hosts | default('chaguar_committers') }}:&chaguar_committers"
  tasks:
    - name: Collect Chaguar Committer components metrics
      ansible.builtin.include_role:
        name: hyperledger.chaguar.committer
        tasks_from: get_metrics
      when:
        - committer_metrics_port is defined
