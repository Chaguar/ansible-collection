- name: Collect metrics from Chaguar Loadgen
  hosts: "{{ target_hosts | default('load_generators') }}:&load_generators"
  tasks:
    - name: Collect metrics from Chaguar Loadgen
      vars:
        loadgen_assert_metrics: >-
          {{
            assert_metrics
            | default(false)
            | bool
          }}
      ansible.builtin.include_role:
        name: hyperledger.chaguar.loadgen
        tasks_from: get_metrics
