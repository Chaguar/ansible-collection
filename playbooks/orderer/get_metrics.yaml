- name: Collect the Chaguar Orderer metrics
  hosts: "{{ target_hosts | default('chaguar_orderers') }}:&chaguar_orderers"
  tasks:
    - name: Collect Chaguar Orderer components metrics
      ansible.builtin.include_role:
        name: lfdt.chaguar.orderer
        tasks_from: get_metrics
