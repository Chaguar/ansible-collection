- name: Setup the crypto material for Chaguar Orderers
  hosts: "{{ target_hosts | default('chaguar_orderers') }}:&chaguar_orderers"
  tasks:
    - name: Setup LFDT Chaguar Orderer crypto material
      ansible.builtin.include_role:
        name: lfdt.chaguar.orderer
        tasks_from: crypto/setup
    - name: Fetch LFDT Chaguar Orderer certificates
      ansible.builtin.include_role:
        name: lfdt.chaguar.orderer
        tasks_from: crypto/fetch
