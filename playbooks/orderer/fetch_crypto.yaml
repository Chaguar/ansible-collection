- name: Fetch the certificates from Chaguar Orderer
  hosts: "{{ target_hosts | default('chaguar_orderers') }}:&chaguar_orderers"
  tasks:
    - name: Fetch the certificates from the Chaguar Orderer components
      ansible.builtin.include_role:
        name: hyperledger.chaguar.orderer
        tasks_from: crypto/fetch
