- name: Fetch the Monitoring tools logs
  hosts: "{{ target_hosts | default('monitoring') }}:&monitoring"
  tasks:
    # =========================
    # Node Exporter
    # =========================
    - name: Fetch the logs from Node Exporter
      ansible.builtin.include_role:
        name: hyperledger.chaguar.node_exporter
        tasks_from: fetch_logs
      when:
        - node_exporter_port is defined
    # =========================
    # Postgres Exporter
    # =========================
    - name: Fetch the logs from Postgres Exporter
      ansible.builtin.include_role:
        name: hyperledger.chaguar.postgres_exporter
        tasks_from: fetch_logs
      when:
        - postgres_exporter_port is defined
    # =========================
    # cAdvisor
    # =========================
    - name: Fetch the logs from cAdvisor
      ansible.builtin.include_role:
        name: hyperledger.chaguar.cadvisor
        tasks_from: fetch_logs
      when:
        - cadvisor_port is defined
    # =========================
    # Prometheus
    # =========================
    - name: Fetch the logs from Prometheus
      ansible.builtin.include_role:
        name: hyperledger.chaguar.prometheus
        tasks_from: fetch_logs
      when:
        - prometheus_port is defined
    # =========================
    # Grafana
    # =========================
    - name: Fetch the logs from Grafana
      ansible.builtin.include_role:
        name: hyperledger.chaguar.grafana
        tasks_from: fetch_logs
      when:
        - grafana_web_port is defined
    # =========================
    # ElasticSearch
    # =========================
    - name: Fetch the logs from ElasticSearch
      ansible.builtin.include_role:
        name: hyperledger.chaguar.elasticsearch
        tasks_from: fetch_logs
      when:
        - elasticsearch_http_port is defined
    # =========================
    # Jaeger
    # =========================
    - name: Fetch the logs from Jaeger
      ansible.builtin.include_role:
        name: hyperledger.chaguar.jaeger
        tasks_from: fetch_logs
      when:
        - jaeger_collector_port is defined
