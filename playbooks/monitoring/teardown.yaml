- name: Teardown the Monitoring services
  hosts: "{{ target_hosts | default('monitoring') }}:&monitoring"
  tasks:
    # =========================
    # Jaeger
    # =========================
    - name: Teardown Jaeger
      ansible.builtin.include_role:
        name: lfdt.chaguar.jaeger
        tasks_from: teardown
      when:
        - jaeger_collector_port is defined
    # =========================
    # ElasticSearch
    # =========================
    - name: Teardown ElasticSearch
      ansible.builtin.include_role:
        name: lfdt.chaguar.elasticsearch
        tasks_from: teardown
      when:
        - elasticsearch_http_port is defined
    # =========================
    # Grafana
    # =========================
    - name: Teardown Grafana
      ansible.builtin.include_role:
        name: lfdt.chaguar.grafana
        tasks_from: teardown
      when:
        - grafana_web_port is defined
    # =========================
    # Alloy
    # =========================
    - name: Teardown Alloy
      ansible.builtin.include_role:
        name: lfdt.chaguar.alloy
        tasks_from: teardown
      when:
        - alloy_port is defined
    # =========================
    # Loki
    # =========================
    - name: Teardown Loki
      ansible.builtin.include_role:
        name: lfdt.chaguar.loki
        tasks_from: teardown
      when:
        - loki_port is defined
    # =========================
    # Prometheus
    # =========================
    - name: Teardown Prometheus
      ansible.builtin.include_role:
        name: lfdt.chaguar.prometheus
        tasks_from: teardown
      when:
        - prometheus_port is defined
    # =========================
    # Postgres Exporter
    # =========================
    - name: Teardown Postgres Exporter nodes
      ansible.builtin.include_role:
        name: lfdt.chaguar.postgres_exporter
        tasks_from: teardown
      when:
        - postgres_exporter_port is defined
    # =========================
    # Node Exporter
    # =========================
    - name: Teardown Node Exporter nodes
      ansible.builtin.include_role:
        name: lfdt.chaguar.node_exporter
        tasks_from: teardown
      when:
        - node_exporter_port is defined
    # =========================
    # cAdvisor
    # =========================
    - name: Teardown cAdvisor nodes
      ansible.builtin.include_role:
        name: lfdt.chaguar.cadvisor
        tasks_from: teardown
      when:
        - cadvisor_port is defined
