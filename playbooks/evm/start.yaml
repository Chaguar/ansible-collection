- name: Start the Chaguar EVM gateway
  hosts: "{{ target_hosts | default('chaguar_evm') }}:&chaguar_evm"
  tasks:
    - name: Start the Chaguar EVM gateway
      vars:
        committer_hosts: >-
          {{
            (
              groups['chaguar_committers']
              | default([])
              | map('extract', hostvars)
              | selectattr('organization', 'defined')
              | selectattr('organization.domain', 'defined')
              | selectattr('organization.domain', '==', organization.domain)
              | map(attribute='inventory_hostname')
              | list
            )
            or groups['chaguar_committers'] | default([])
          }}
        orderer_router_hosts: >-
          {{
            groups['chaguar_orderers']
            | default([])
            | map('extract', hostvars)
            | selectattr('orderer_component_type', 'defined')
            | selectattr('orderer_component_type', '==', 'router')
            | map(attribute='inventory_hostname')
            | list
          }}
      ansible.builtin.include_role:
        name: lfdt.chaguar.evm
        tasks_from: start
      when:
        - evm_port is defined
