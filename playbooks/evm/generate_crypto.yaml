- name: Setup the crypto material for the Chaguar EVM gateway
  hosts: "{{ target_hosts | default('chaguar_evm') }}:&chaguar_evm"
  tasks:
    - name: Setup the crypto material for the Chaguar EVM gateway
      ansible.builtin.include_role:
        name: hyperledger.chaguar.evm
        tasks_from: crypto/setup
    - name: Fetch Chaguar EVM certificates
      ansible.builtin.include_role:
        name: hyperledger.chaguar.evm
        tasks_from: crypto/fetch
