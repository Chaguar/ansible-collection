# Deploy a complete Chaguar network in one run: binaries, crypto material,
# genesis block, configs, start, and namespaces. Equivalent to
# `make setup start init`. Running everything in one invocation shares
# gathered facts between the steps, so no fact cache is needed.
#
#   ansible-playbook lfdt.chaguar.deploy -i inventory.yaml
#
# Remove the network again with lfdt.chaguar.teardown.

- name: Build binaries
  ansible.builtin.import_playbook: lfdt.chaguar.binaries

- name: Generate crypto material
  ansible.builtin.import_playbook: lfdt.chaguar.generate_crypto

- name: Build genesis block
  ansible.builtin.import_playbook: lfdt.chaguar.build_genesis_block

- name: Transfer configs
  ansible.builtin.import_playbook: lfdt.chaguar.configs

- name: Start the network
  ansible.builtin.import_playbook: lfdt.chaguar.start

- name: Create namespaces
  ansible.builtin.import_playbook: lfdt.chaguar.init
